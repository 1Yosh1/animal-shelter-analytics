[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "animal-shelter-analytics"
version = "1.0.0"
description = "Analytics warehouse (dbt + DuckDB) over Austin Animal Center intake/outcome data"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = []

[tool.setuptools]
packages = ["scripts"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_analysis_notebook.py" = ["E501"]
"scripts/make_ci_seed.py" = ["E501"]  # literal seed rows read better on one line

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
